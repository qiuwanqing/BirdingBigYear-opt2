<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<meta name="theme-color" content="#dddad4" />
<meta name="description" content="Supermarket Birding — Enter a glass sphere and explore a scanned supermarket through binoculars." />
<title>Supermarket Birding — Sphere Portal</title>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<div id="app" class="mode-outside">
  <canvas id="webgl" aria-label="拖动玻璃球环视超市全景，滚轮进入 SPACE LINES 观鸟场景"></canvas>
  <div id="gl-fallback" hidden>WebGL 无法初始化，请尝试使用 Chrome 或 Safari 并启用硬件加速。</div>
  <div class="vignette" aria-hidden="true"></div>
  <div id="portal-vignette" aria-hidden="true"></div>
  <p id="environment-status" class="sr-only" role="status">正在加载超市全景…</p>
  
  <div class="scroll-indicator" id="scroll-indicator"><div class="scroll-orbit"><div class="scroll-dot"></div></div><span>SCROLL TO APPROACH</span><span class="down-arrow">↓</span></div>
  <section id="inside-ui" aria-label="超市内部观鸟界面" aria-hidden="true">
    <div id="release-sky" aria-hidden="true" hidden></div>
    <div class="binocular-overlay"><div class="lens lens-left" aria-hidden="true"></div><div class="lens lens-right" aria-hidden="true"></div><div class="aim-reticle" aria-hidden="true"></div></div>

  </section>
  <section id="product-ui" aria-label="扫描商品观察" hidden>

    <div id="product-reticle" class="aim-reticle" aria-hidden="true"></div>
    <p id="shot-note" class="shot-note" role="status" hidden></p>

  </section>
  <nav id="habitat-tools" aria-label="观察工具" hidden inert>
    <button id="tools-toggle" aria-expanded="false" aria-controls="tools-panel" aria-label="展开或收起设置菜单"><img src="./assets/setting.svg" alt="" width="200" height="111" /></button>
    <div id="tools-panel" hidden inert>
      <div class="tool-group" data-tool-mode="habitat"><button id="zoom-button" aria-pressed="false">ZOOM 1x</button><button id="spot-button" aria-pressed="false">LOCK VIEW</button><button id="exit-button">BACK</button><button id="collection-button">ARCHIVE</button><button id="sky-button">SKY</button><button id="resume-button" hidden>RESUME LOOK</button></div>
      <div class="tool-group" data-tool-mode="product" hidden inert><button id="close-product">BACK TO HABITAT ↖</button><button id="inspect-button" disabled>PREPARE VIDEO SHOT ↗</button><button id="product-collection" hidden>SIGHTING 01 ↗</button></div>
      <div class="tool-group" data-tool-mode="shot" hidden inert><button id="shot-download" disabled>DOWNLOAD</button><button id="shot-sky-preview">SKY</button><button id="shot-resume" aria-pressed="true">LOCK</button><button id="shot-back">BACK</button></div>
      <div class="tool-group" data-tool-mode="video" hidden inert><output id="video-status" role="status" hidden></output><button id="video-retry" hidden>RETRY</button><button id="video-skip">SKY</button><button id="video-back">BACK</button></div>
      <div class="tool-group" data-tool-mode="selection" hidden inert>
        <output id="bird-selection-status" role="status" aria-live="polite">LEFT: SELECT · RIGHT: PREVIEW</output>
        <button id="bird-point" aria-pressed="true">POINT +</button><button id="bird-exclude" aria-pressed="false">POINT −</button>
        <button id="bird-box" aria-pressed="false">BOX</button><button id="bird-brush" aria-pressed="false">BRUSH +</button><button id="bird-erase" aria-pressed="false">ERASE</button>
        <button id="bird-undo">UNDO ↶</button><button id="bird-candidate">NEXT PREVIEW ↗</button><button id="bird-reset">CLEAR SELECTION</button>
        <button id="bird-confirm" disabled>CONFIRM & RELEASE ↗</button><button id="bird-cancel">BACK TO PRODUCT ↖</button>
      </div>
      <div class="tool-group" data-tool-mode="collection" hidden inert><button id="sky-clear">CLEAR</button><button id="sky-back">BACK</button></div>
    </div>
  </nav>
  <div id="loading" class="loading">PREPARING HABITAT <span id="loading-symbol">·</span></div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
